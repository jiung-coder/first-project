<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3개 부처 보도자료 검색</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>3개 부처 보도자료</h1>
    <p class="sub">2026-05-25 호우 대응 · 행정안전부 · 기상청 · 경찰청</p>
  </header>

  <main>
    <section class="search-box">
      <input id="keyword" type="search" placeholder="부처 또는 본문 키워드 (예: 1,820명, 기상청, 중대본)" autocomplete="off" />
      <p id="result-count" class="result-count" aria-live="polite"></p>
    </section>

    <section id="cards" class="cards" aria-label="보도자료 목록"></section>

    <section class="video-section">
      <h2>관련 영상</h2>
      <div id="video-area"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>본 페이지의 보도자료 내용은 예시 데이터입니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
