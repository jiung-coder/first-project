<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 안전점검 보고서 (가상)</title>
<style>
  :root { --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f7f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color:var(--fg); background:var(--bg); line-height:1.6; }
  header, main { max-width: 880px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; font-size: .9rem; }
  .filter { display:flex; gap:8px; margin: 16px 0; }
  .filter input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; }
  .count { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .grid { display:grid; gap:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .card .chap { font-size:.8rem; color:var(--accent); font-weight:600; }
  .card h2 { font-size:1.1rem; margin: 2px 0 6px; }
  .card p { margin:0; color:#374151; }
  .empty { color: var(--muted); text-align:center; padding: 24px 0; }
  section.embed { margin-top: 32px; }
  section.embed iframe { width:100%; height:480px; border:1px solid var(--line); border-radius:12px; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>2026 행정안전부 안전점검 결과 보고서 (가상)</h1>
  <p class="sub">장 단위 요약 카드 · 제목/본문 검색</p>
</header>
<main>
  <div class="filter">
    <input id="q" type="search" placeholder="제목 또는 본문 키워드 입력 (예: 예산, 시정)" autocomplete="off">
  </div>
  <div id="count" class="count"></div>
  <div id="list" class="grid"></div>

  <section class="embed">
    <h2 style="font-size:1.1rem">정합성 매트릭스</h2>
    <!-- Google Sheets 게시 후 "파일 > 웹에 게시 > 임베드"에서 받은 iframe 코드로 교체 -->
    <iframe src="about:blank" title="정합성 매트릭스 (Google Sheets 임베드 예정)"></iframe>
  </section>
</main>

<script>
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const qEl = document.getElementById('q');
  let chapters = [];

  const plain = s => s.replace(/\*\*/g, '');
  const summary = s => {
    const t = plain(s).replace(/\s+/g, ' ').trim();
    return t.length > 120 ? t.slice(0, 120) + '…' : t;
  };

  function render() {
    const kw = qEl.value.trim().toLowerCase();
    const hits = chapters.filter(c =>
      !kw || c.제목.toLowerCase().includes(kw) || c.본문.toLowerCase().includes(kw)
    );
    countEl.textContent = `결과 ${hits.length}건`;
    listEl.replaceChildren();
    if (!hits.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '검색 결과가 없습니다.';
      listEl.append(d);
      return;
    }
    for (const c of hits) {
      const card = document.createElement('article');
      card.className = 'card';
      const chap = document.createElement('div');
      chap.className = 'chap';
      chap.textContent = `제${c.장}장`;
      const h = document.createElement('h2');
      h.textContent = c.제목;
      const p = document.createElement('p');
      p.textContent = summary(c.본문);
      card.append(chap, h, p);
      listEl.append(card);
    }
  }

  fetch('장데이터.json')
    .then(r => r.json())
    .then(data => { chapters = data; render(); })
    .catch(() => { countEl.textContent = '데이터를 불러오지 못했습니다. 장데이터.json 위치를 확인하세요.'; });

  qEl.addEventListener('input', render);
</script>
</body>
</html>
